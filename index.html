<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 面试模拟器 - 终极版 (本地化部署)</title>
<script src="./marked.min.js"></script>
<script src="./purify.min.js"></script>
<style>
  :root {
    --bg: #f5f0e8;
    --bg-card: #faf7f2;
    --brown-deep: #2c1f0e;
    --brown-mid: #5a3e28;
    --brown-light: #8c6a4a;
    --accent: #d4622a;
    --accent-hover: #b8501f;
    --border: #e0d5c5;
    --text: #2c1f0e;
    --text-muted: #7a6550;
    --success: #4a7c59;
    --tag-bg: #ede5d8;
    --ai-bubble: #fff8f3;
    --user-bubble: #2c1f0e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 0 0 60px;
  }

  header { background: var(--brown-deep); padding: 24px 20px 20px; text-align: center; }
  header .badge {
    display: inline-block; font-size: 11px; letter-spacing: 0.12em;
    color: var(--accent); background: rgba(212,98,42,0.12);
    border: 1px solid rgba(212,98,42,0.3); border-radius: 20px;
    padding: 3px 10px; margin-bottom: 10px; text-transform: uppercase;
  }
  header h1 { font-size: 22px; font-weight: 700; color: #f5f0e8; }
  header p { font-size: 13px; color: #a89070; margin-top: 6px; }

  .tab-bar {
    display: flex; background: var(--brown-deep);
    border-top: 1px solid rgba(255,255,255,0.06); padding: 0 20px;
  }
  .tab-btn {
    flex: 1; padding: 12px 0; background: none; border: none;
    border-bottom: 2px solid transparent; font-size: 14px; color: #7a6550;
    cursor: pointer; transition: all 0.2s;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  .main { max-width: 680px; margin: 0 auto; padding: 20px 16px 0; }

  .card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 16px;
  }
  .card-title {
    font-size: 13px; font-weight: 600; color: var(--brown-mid);
    letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 14px;
    display: flex; align-items: center; gap: 6px;
  }
  .dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; display: inline-block; }

  .select-grid { display: grid; gap: 8px; }
  .select-grid-2 { grid-template-columns: repeat(2, 1fr); }
  .select-grid-3 { grid-template-columns: repeat(3, 1fr); }
  .sel-btn {
    padding: 10px 8px; border: 1.5px solid var(--border); border-radius: 8px;
    background: var(--bg); font-size: 13px; color: var(--brown-mid);
    cursor: pointer; transition: all 0.15s; text-align: center;
  }
  .sel-btn.active { border-color: var(--accent); background: rgba(212,98,42,0.07); color: var(--accent); font-weight: 600; }
  .sel-btn .sel-name { font-weight: 600; display: block; font-size: 13px; }
  .sel-btn .sel-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .tag-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag-btn {
    padding: 6px 14px; border: 1.5px solid var(--border); border-radius: 20px;
    background: var(--bg); font-size: 13px; color: var(--brown-mid); cursor: pointer; transition: all 0.15s;
  }
  .tag-btn.active { border-color: var(--accent); background: rgba(212,98,42,0.07); color: var(--accent); font-weight: 600; }
  .custom-tag { border-style: dashed; }

  textarea, input[type="text"], input[type="password"], select {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px;
    background: var(--bg); font-size: 14px; color: var(--text); font-family: inherit; outline: none; transition: border-color 0.15s;
  }
  textarea:focus, input:focus, select:focus { border-color: var(--accent); }
  textarea { min-height: 80px; resize: vertical; }

  .key-section { border: 1.5px dashed var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
  .key-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .key-title { font-size: 13px; font-weight: 600; color: var(--brown-mid); }
  .key-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: rgba(212,98,42,0.1); color: var(--accent); }
  .key-input-wrap { position: relative; margin-bottom: 8px; }
  .key-input-wrap input { padding-right: 70px; }
  .key-toggle { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--text-muted); cursor: pointer; background: none; border: none; padding: 4px 6px; }
  .key-toggle:hover { color: var(--accent); }
  .key-tip { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
  .adv-row { display: flex; gap: 8px; margin-top: 8px; }

  .start-btn {
    width: 100%; padding: 14px; background: var(--accent); color: #fff;
    border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.15s; letter-spacing: 0.03em; margin-bottom: 20px;
  }
  .start-btn:hover:not(:disabled) { background: var(--accent-hover); }

  /* Markdown 样式池 */
  .md-content { font-size: 14px; line-height: 1.7; word-wrap: break-word; }
  .md-content p { margin-bottom: 10px; }
  .md-content code { background: rgba(0,0,0,0.06); padding: 2px 4px; border-radius: 4px; font-family: monospace; color: #c0392b; font-size: 13px; }
  .md-content pre { background: #2c1f0e; color: #f5f0e8; padding: 12px; border-radius: 8px; overflow-x: auto; margin-bottom: 12px; }
  .md-content pre code { background: transparent; color: inherit; padding: 0; }
  .md-content ul, .md-content ol { margin-left: 20px; margin-bottom: 10px; }
  .md-content h3, .md-content h4 { margin: 16px 0 8px; color: var(--brown-mid); font-size: 15px; font-weight: 600; }
  .md-content blockquote { border-left: 4px solid var(--accent); padding-left: 10px; color: var(--text-muted); margin-bottom: 10px; background: rgba(212,98,42,0.05); }

  /* 题库模式 */
  .question-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .q-num { font-size: 12px; font-weight: 600; color: var(--accent); letter-spacing: 0.08em; }
  .q-type-tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--tag-bg); color: var(--brown-mid); }
  .q-text { font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.6; margin-bottom: 16px; }
  .q-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .q-action-btn { padding: 7px 14px; border: 1.5px solid var(--border); border-radius: 6px; background: var(--bg); font-size: 12px; color: var(--brown-mid); cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 4px; }
  .q-action-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .q-action-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .q-action-btn.primary:hover:not(:disabled) { background: var(--accent-hover); }
  .q-action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .q-ref { background: rgba(74,124,89,0.07); border: 1px solid rgba(74,124,89,0.2); border-radius: 8px; padding: 12px 14px; font-size: 13px; color: #3d6b4a; line-height: 1.7; display: none; margin-top: 12px; }
  .q-ref.show { display: block; }
  
  .ai-review { background: var(--ai-bubble); border: 1px solid rgba(212,98,42,0.2); border-radius: 10px; padding: 14px 16px; margin-top: 12px; display: none; }
  .ai-review.show { display: block; }
  .ai-review-header { font-size: 11px; font-weight: 600; color: var(--accent); letter-spacing: 0.08em; margin-bottom: 8px; display: flex; justify-content: space-between;}
  
  /* 进度条 */
  .progress-bar-wrap { background: var(--border); border-radius: 4px; height: 4px; margin-bottom: 16px; }
  .progress-bar { background: var(--accent); height: 4px; border-radius: 4px; transition: width 0.3s; }

  /* 聊天模式 */
  .chat-info { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 12px; font-size: 13px; color: var(--brown-mid); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chat-info .info-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
  
  .chat-window { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; min-height: 400px; max-height: 500px; overflow-y: auto; padding: 16px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
  .chat-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 14px; text-align: center; }
  
  .msg { display: flex; gap: 10px; max-width: 100%; }
  .msg.user { flex-direction: row-reverse; }
  .msg-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; font-weight: 700; cursor: pointer;}
  .ai-avatar { background: var(--accent); color: #fff; }
  .user-avatar { background: var(--brown-deep); color: #f5f0e8; font-size: 12px; }
  .msg-bubble { max-width: 85%; padding: 12px 14px; border-radius: 12px; position: relative; }
  .ai-bubble { background: var(--ai-bubble); border: 1px solid rgba(212,98,42,0.15); color: var(--text); border-radius: 4px 12px 12px 12px; }
  .user-bubble { background: var(--brown-deep); color: #f5f0e8; border-radius: 12px 4px 12px 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
  
  .tts-btn { position: absolute; bottom: -20px; left: 0; font-size: 12px; background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 2px 4px; display: none; }
  .ai-bubble:hover .tts-btn { display: block; }
  .tts-btn:hover { color: var(--accent); }

  .chat-input-area { display: flex; gap: 8px; align-items: flex-end; position: relative; }
  .chat-input-area textarea { flex: 1; min-height: 44px; max-height: 120px; resize: none; padding: 10px 12px; font-size: 14px; }
  .voice-btn { position: absolute; right: 54px; bottom: 8px; background: none; border: none; font-size: 18px; color: var(--text-muted); cursor: pointer; padding: 4px; transition: color 0.2s; }
  .voice-btn.recording { color: #c0392b; animation: pulse 1s infinite; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
  
  .send-btn { width: 44px; height: 44px; flex-shrink: 0; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
  .send-btn:hover:not(:disabled) { background: var(--accent-hover); }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  
  .chat-controls { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .ctrl-btn { padding: 6px 12px; border: 1.5px solid var(--border); border-radius: 6px; background: var(--bg); font-size: 12px; color: var(--brown-mid); cursor: pointer; transition: all 0.15s; }
  .ctrl-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .ctrl-btn.danger:hover:not(:disabled) { border-color: #c0392b; color: #c0392b; }
  .ctrl-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* 可视化评分卡 */
  .score-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-top: 16px; display: none; }
  .score-card.show { display: block; animation: slideUp 0.4s ease-out; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .score-header { font-size: 16px; font-weight: 700; color: var(--brown-mid); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
  .score-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .score-label { font-size: 13px; font-weight: 600; color: var(--brown-mid); min-width: 60px; }
  .score-track { flex: 1; background: var(--border); border-radius: 6px; height: 8px; overflow: hidden; }
  .score-fill { height: 100%; border-radius: 6px; background: var(--accent); width: 0%; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
  .score-val { font-size: 14px; font-weight: 700; color: var(--accent); min-width: 32px; text-align: right; }
  .score-comment { font-size: 13px; color: var(--text-dim); line-height: 1.7; margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--border); }

  /* 历史记录 */
  .history-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .history-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .history-time { font-size: 11px; color: var(--text-muted); }
  .history-actions { display: flex; gap: 8px; margin-top: 10px;}

  /* 模态弹窗（恢复会话） */
  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(44,31,14,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; }
  .modal { background: var(--bg-card); padding: 24px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; color: var(--brown-deep); }
  .modal-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.6; }
  .modal-btns { display: flex; gap: 10px; justify-content: center; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--brown-deep); color: #f5f0e8; padding: 10px 20px; border-radius: 20px; font-size: 13px; opacity: 0; transition: all 0.25s; z-index: 999; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .loading-dots span { animation: blink 1.2s infinite; font-size: 20px; }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }
</style>
</head>
<body>

<header>
  <div class="badge">AI · 面试工具</div>
  <h1>AI 面试模拟器</h1>
  <p>全行业岗位 · 多语种支持 · 智能打分</p>
</header>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('setup')">⚙️ 面试设置</button>
  <button class="tab-btn" onclick="switchTab('history')">📋 面试复盘</button>
</div>

<div class="main">
  <div id="tab-setup">
    <div class="card">
      <div class="card-title"><span class="dot"></span>岗位方向</div>
      <div class="select-grid select-grid-2">
        <button class="sel-btn active" onclick="selectField(this,'tech')"><span class="sel-name">💻 技术研发岗</span></button>
        <button class="sel-btn" onclick="selectField(this,'pm')"><span class="sel-name">📊 产品设计与运营</span></button>
      </div>
    </div>
    
    <div class="card" id="tech-positions">
      <div class="card-title"><span class="dot"></span>具体岗位</div>
      <div class="tag-row" id="position-tags">
        <button class="tag-btn active" onclick="selectPosition(this,'Java 后端开发')">Java 后端开发</button>
        <button class="tag-btn" onclick="selectPosition(this,'后端开发 (通用/Go/C++)')">后端开发 (通用/Go/C++)</button>
        <button class="tag-btn" onclick="selectPosition(this,'前端开发')">前端开发</button>
        <button class="tag-btn" onclick="selectPosition(this,'大模型应用开发')">大模型应用开发</button>
        <button class="tag-btn" onclick="selectPosition(this,'算法工程师')">算法工程师</button>
        <button class="tag-btn" onclick="selectPosition(this,'AI Infra')">AI Infra</button>
        <button class="tag-btn" onclick="selectPosition(this,'数据工程师')">数据工程师</button>
        <button class="tag-btn" onclick="selectPosition(this,'DBA/数据库')">DBA/数据库</button>
        <button class="tag-btn" onclick="selectPosition(this,'测试开发(QA)')">测试开发(QA)</button>
        <button class="tag-btn" onclick="selectPosition(this,'移动端(iOS/Android)')">移动端(iOS/Android)</button>
        <button class="tag-btn custom-tag" onclick="toggleCustomPosition()">➕ 自定义</button>
      </div>
    </div>
    
    <div class="card" id="pm-positions" style="display:none;">
      <div class="card-title"><span class="dot"></span>具体岗位</div>
      <div class="tag-row">
        <button class="tag-btn active" onclick="selectPosition(this,'产品经理')">产品经理</button>
        <button class="tag-btn" onclick="selectPosition(this,'运营')">运营</button>
        <button class="tag-btn" onclick="selectPosition(this,'数据分析')">数据分析</button>
        <button class="tag-btn" onclick="selectPosition(this,'市场营销')">市场营销</button>
        <button class="tag-btn" onclick="selectPosition(this,'商务拓展')">商务拓展</button>
        <button class="tag-btn" onclick="selectPosition(this,'UI/UX 设计')">UI/UX 设计</button>
        <button class="tag-btn" onclick="selectPosition(this,'HR/行政')">HR/行政</button>
        <button class="tag-btn" onclick="selectPosition(this,'销售/大客户')">销售/大客户</button>
        <button class="tag-btn custom-tag" onclick="toggleCustomPosition()">➕ 自定义</button>
      </div>
    </div>

    <div id="custom-position-container" style="display:none; margin-bottom:16px;">
      <input type="text" id="custom-position-input" placeholder="输入你想面试的岗位，如：Web3 游戏策划、医疗器械销售..." />
    </div>

    <div class="card">
      <div class="card-title"><span class="dot"></span>面试语言 / 地区场景</div>
      <div class="tag-row">
        <button class="tag-btn active" onclick="selectLanguage(this,'中文')">🇨🇳 中文 (默认)</button>
        <button class="tag-btn" onclick="selectLanguage(this,'全英文')">🇺🇸 全英文 (北美/外企)</button>
        <button class="tag-btn" onclick="selectLanguage(this,'全日文')">🇯🇵 全日文 (赴日 IT)</button>
        <button class="tag-btn" onclick="selectLanguage(this,'中英混杂')">🔤 中英混杂 (外企黑话)</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="dot"></span>练习模式</div>
      <div class="select-grid select-grid-2">
        <button class="sel-btn active" onclick="selectMode(this,'bank')">
          <span class="sel-name">📚 题库模式</span><span class="sel-desc">逐题作答 + AI 点评</span>
        </button>
        <button class="sel-btn" onclick="selectMode(this,'chat')">
          <span class="sel-name">🤖 AI 对话模式</span><span class="sel-desc">拟真追问 + 综合打分</span>
        </button>
      </div>
    </div>

    <div class="card" id="count-card">
      <div class="card-title"><span class="dot"></span>题目数量</div>
      <div class="tag-row">
        <button class="tag-btn" onclick="selectQCount(this,5)">5 题</button>
        <button class="tag-btn active" onclick="selectQCount(this,10)">10 题</button>
        <button class="tag-btn" onclick="selectQCount(this,20)">20 题（含动态出题）</button>
      </div>
    </div>

    <div class="card" id="bg-card" style="display:none;">
      <div class="card-title"><span class="dot"></span>个人背景（可选）</div>
      <textarea id="bg-input" placeholder="简单介绍背景，如：本科在读，熟悉Python，有一段字节实习经历..."></textarea>
    </div>

    <div class="key-section">
      <div class="key-header">
        <span class="key-title">🔑 API Key</span>
      </div>
      <div class="key-input-wrap">
        <input type="password" id="api-key" placeholder="填入 API Key 启用 AI 能力 (自动保存在本地)" oninput="saveKey()">
        <button class="key-toggle" onclick="toggleKey()">显示</button>
      </div>
      <div class="adv-row">
        <select id="model-select" style="flex:1;">
          <option value="gpt-4o-mini">gpt-4o-mini</option>
          <option value="deepseek-chat">deepseek-chat</option>
        </select>
        <input type="text" id="base-url" placeholder="自定义 BaseURL" style="flex:1.5;">
      </div>
    </div>

    <button class="start-btn" onclick="startNewInterview()">开始面试</button>
  </div>

  <div id="tab-bank" style="display:none;">
    <div class="progress-bar-wrap"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="card" style="padding:14px 20px; display:flex; justify-content:space-between; align-items:center;">
      <span id="bank-meta" style="font-size:13px;color:var(--brown-mid);font-weight:600;"></span>
      <button class="ctrl-btn danger" onclick="endInterview()">结束复盘</button>
    </div>
    <div id="bank-question-area"></div>
    <div style="display:flex;gap:8px;margin-bottom:20px;">
      <button class="q-action-btn" style="flex:1;" onclick="prevQuestion()">← 上一题</button>
      <button class="q-action-btn primary" style="flex:1;" onclick="nextQuestion()" id="bank-next-btn">下一题 →</button>
    </div>
  </div>

  <div id="tab-chat" style="display:none;">

// --- 启动面试 ---
function startNewInterview() {
  const key = document.getElementById('api-key').value.trim();
  
  // 处理自定义岗位
  const customContainer = document.getElementById('custom-position-container');
  const isCustom = customContainer.style.display !== 'none';
  if (isCustom) {
      const customVal = document.getElementById('custom-position-input').value.trim();
      if (!customVal) { showToast('请输入自定义岗位名称'); return; }
      session.position = customVal;
  }
  
  const isForeign = session.language !== '中文';

  if (!key && (session.mode === 'chat' || isCustom || isForeign)) {
    showToast('AI对话 / 外语 / 自定义岗位，需配置 API Key！'); return;
  }
  
  clearSession();
  session.currentQ = 0;
  session.answersState = [];
  session.chatHistory = [];
  
  if (session.mode === 'bank') {
    let bank = [];
    if (!isCustom && !isForeign) {
        bank = questionBank[session.field]?.[session.position] || [];
    }
    session.questions = [...bank].sort(() => Math.random() - 0.5).slice(0, session.qCount);
    session.answersState = new Array(session.qCount).fill(null).map(()=>({ userAns:'', aiReview:'' }));
    switchTab('bank');
    renderBankQuestion();
  } else {
    switchTab('chat');
    document.getElementById('score-card').classList.remove('show');
    document.getElementById('chat-window').innerHTML = '';
    const bg = document.getElementById('bg-input').value.trim();
    const sysPrompt = `你是一位资深 ${session.position} 面试官。${bg ? `候选人背景：${bg}` : ''}
【核心要求】请严格使用 ${session.language} 进行提问和反馈，禁止使用其他语言。
规则：
1. 每次只问一个问题。结合上一轮回答进行深度追问（使用STAR法则挖掘细节）。
2. 如果候选人回答不知道，给出一点提示引导，不要直接挂断。
3. 保持对话自然、适度施压，扮演真实面试官。`;
    session.chatHistory = [{ role: 'system', content: sysPrompt }];
    sendAIMessage(`Hello，我们可以开始面试了吗？请先做一个简短的自我介绍。 (要求: 请使用 ${session.language} 回复)`);
  }
  saveSession();
}

// --- 题库模式渲染 ---

  document.getElementById('bank-meta').textContent = `${session.position} (${session.language}) · 第 ${session.currentQ+1} / ${session.qCount} 题`;
  
  // 动态兜底生成题库
  if (session.currentQ >= session.questions.length && session.questions.length < session.qCount) {
    await fetchDynamicQuestion();
  }

  const state = session.answersState[session.currentQ];
  
  const area = document.getElementById('bank-question-area');
  area.innerHTML = `
    <div class="question-card">
      <div class="q-header">
        <span class="q-num">Q${session.currentQ+1}</span>
      </div>
      <div class="q-text">${DOMPurify.sanitize(marked.parse(q.q))}</div>
      <div class="q-answer-area">
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">你的草稿/回答（支持自动保存）</div>
        <textarea id="my-answer" oninput="saveCurrentAnswer()">${state.userAns}</textarea>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="q-action-btn" onclick="document.getElementById('q-ref').classList.toggle('show')">👁️ 参考思路</button>
        <button class="q-action-btn primary" id="ai-review-btn" onclick="getBankAIReview()">🤖 AI 深度点评</button>
      </div>

function saveCurrentAnswer() {
  session.answersState[session.currentQ].userAns = document.getElementById('my-answer').value;
  saveSession();
}

function prevQuestion() { if(session.currentQ > 0) { session.currentQ--; renderBankQuestion(); } }
function nextQuestion() {
  if (session.currentQ < session.qCount - 1) { session.currentQ++; renderBankQuestion(); }
  else { endInterview(); }
}

// 动态题库生成
async function fetchDynamicQuestion() {
  const key = document.getElementById('api-key').value.trim();
  document.getElementById('bank-question-area').innerHTML = '<div style="text-align:center;padding:40px;color:var(--accent);">🤖 正在为您实时生成新的面试题...</div>';
  const usedQs = session.questions.map(q=>q.q).join('；');
  const prompt = `你是一个面试官。当前岗位：${session.position}。面试语言要求：${session.language}。
我已经问了以下问题：${usedQs || '无'}。请生成第 ${session.currentQ+1} 题，要求不同于前面的问题，并附带参考思路。
请严格输出JSON格式，不要有任何 Markdown 标记或多余文本：
{"q": "问题内容(${session.language})", "ref": "参考答案要点(${session.language})"}`;
  
  try {
    const res = await callAPI(prompt, key, false);
    const match = res.match(/\{[\s\S]*\}/);
    if(match) {
      const data = JSON.parse(match[0]);
      session.questions.push({q: data.q, ref: data.ref});
    } else throw new Error('JSON解析失败');
  } catch(e) {
    session.questions.push({
      q: `动态生成失败，请描述一下你做过最难的项目？ (Language: ${session.language})`, 
      ref: "使用 STAR 法则作答。"
    });
  }
}

// 题库模式 AI点评
async function getBankAIReview() {
  const key = document.getElementById('api-key').value.trim();
  if(!key) { showToast('需配置 API Key'); return; }
  const ans = document.getElementById('my-answer').value.trim();
  if(!ans) { showToast('请先写点思路'); return; }
  
  const btn = document.getElementById('ai-review-btn');
  const textEl = document.getElementById('ai-review-text');
  document.getElementById('ai-review').classList.add('show');
  textEl.innerHTML = '<span class="loading-dots"><span>·</span><span>·</span><span>·</span></span>';
  btn.disabled = true;
  
  const q = session.questions[session.currentQ];
  const prompt = `面试题：${q.q}\n候选人回答：${ans}\n请用 Markdown 格式，严格使用 ${session.language} 语言，从核心要点、优点、遗漏点三个维度进行犀利点评。`;
  
  try {
    const review = await callAPI(prompt, key, true, (text) => {
      textEl.innerHTML = DOMPurify.sanitize(marked.parse(text));
    });

    saveSession();
  } catch(e) {
    if(e.name!=='AbortError') textEl.textContent = '请求失败：'+e.message;
  } finally {
    btn.disabled = false;
  }
}

// --- 聊天模式逻辑 ---
function renderChatHistory() {
  const w = document.getElementById('chat-window');
  w.innerHTML = '';
  document.getElementById('chat-meta-text').textContent = `${session.position} (${session.language}) · AI 面试`;
  session.chatHistory.forEach(msg => {
    if (msg.role !== 'system') appendMsg(msg.role==='user'?'user':'ai', msg.content);
  });
  scrollChat();
}

function handleChatKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

async function sendMessage() {
  if(isGenerating) return;
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  appendMsg('user', text);
  session.chatHistory.push({ role:'user', content:text });
  saveSession();
  await sendAIMessage();
}

async function sendAIMessage(overridePrompt = null) {
  const key = document.getElementById('api-key').value.trim();
  if (!key) { showToast('请配置 API Key'); return; }
  
  if (overridePrompt) {
    appendMsg('user', overridePrompt);
    session.chatHistory.push({ role:'user', content:overridePrompt });
  }

  isGenerating = true;
  document.getElementById('send-btn').disabled = true;
  document.getElementById('stop-btn').style.display = 'block';
  
  const bubble = appendMsg('ai', '<span class="loading-dots"><span>·</span><span>·</span><span>·</span></span>');
  const textEl = bubble.querySelector('.msg-bubble');
  
  // 滑动窗口策略：保留 System，发送最近 8 条
  let payload = [...session.chatHistory];
  if(payload.length > 9) payload = [payload[0], ...payload.slice(-8)];

  try {
    const fullText = await callAPI(payload, key, true, (text) => {
      textEl.innerHTML = DOMPurify.sanitize(marked.parse(text));
      // 为 AI 气泡添加语音播报按钮
      if(!textEl.querySelector('.tts-btn')) {
         textEl.innerHTML += `<button class="tts-btn" onclick="speakText(this)">🔊 朗读</button>`;
      }
      scrollChat();
    });
    session.chatHistory.push({ role:'assistant', content:fullText });
    saveSession();
  } catch(e) {
    if(e.name !== 'AbortError') textEl.textContent = '网络错误：'+e.message;
  } finally {
    isGenerating = false;
    document.getElementById('send-btn').disabled = false;
    document.getElementById('stop-btn').style.display = 'none';
  }
}

function appendMsg(role, text) {
  const w = document.getElementById('chat-window');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const displayHtml = text.includes('loading-dots') ? text : DOMPurify.sanitize(marked.parse(text));
  div.innerHTML = `
    <div class="msg-avatar ${role}-avatar">${role==='ai'?'面':'我'}</div>
    <div class="msg-bubble ${role}-bubble md-content">${displayHtml}
      ${role==='ai' && !text.includes('loading-dots') ? `<button class="tts-btn" onclick="speakText(this)">🔊 朗读</button>` : ''}
    </div>
  `;
  w.appendChild(div);
  scrollChat();
  return div;
}
function scrollChat() { const w=document.getElementById('chat-window'); w.scrollTop=w.scrollHeight; }

function abortStream() {
  if(abortController) abortController.abort();
  isGenerating = false;
  document.getElementById('stop-btn').style.display = 'none';
  document.getElementById('send-btn').disabled = false;
}

// --- 雷达图/打分面板 (拦截JSON) ---
async function generateScoreCard() {
  if (isGenerating) return;
  const key = document.getElementById('api-key').value.trim();
  document.getElementById('score-card').classList.add('show');
  document.getElementById('score-btn').disabled = true;
  document.getElementById('score-content').innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);">正在分析您的面试表现...</div>';
  
  const prompt = `面试结束。请根据整个对话记录，评估候选人。
严格以纯 JSON 格式返回，包含四个维度的分数(0-100)和总评，格式如下：
{"communication": 85, "technical": 80, "logical": 90, "overall": 85, "comment": "综合评价内容(${session.language})..."}`;
  
  let payload = [...session.chatHistory, {role:'user', content:prompt}];
  if(payload.length > 15) payload = [payload[0], ...payload.slice(-14)];

  try {
    const res = await callAPI(payload, key, false);
    const match = res.match(/\{[\s\S]*\}/);
    if(match) {
      const data = JSON.parse(match[0]);
      document.getElementById('score-content').innerHTML = `
        <div class="score-row"><div class="score-label">专业深度</div><div class="score-track"><div class="score-fill" style="width:${data.technical}%"></div></div><div class="score-val">${data.technical}</div></div>
        <div class="score-row"><div class="score-label">逻辑思维</div><div class="score-track"><div class="score-fill" style="width:${data.logical}%"></div></div><div class="score-val">${data.logical}</div></div>
        <div class="score-row"><div class="score-label">表达沟通</div><div class="score-track"><div class="score-fill" style="width:${data.communication}%"></div></div><div class="score-val">${data.communication}</div></div>
        <div class="score-row" style="margin-top:20px;"><div class="score-label" style="color:var(--accent);">综合得分</div><div class="score-track"><div class="score-fill" style="width:${data.overall}%;background:var(--red);"></div></div><div class="score-val" style="font-size:18px;">${data.overall}</div></div>
        <div class="score-comment md-content">${DOMPurify.sanitize(marked.parse(data.comment))}</div>
      `;
      session.chatHistory.push({ role:'system', content: `[打分结果] 综合得分：${data.overall}\n${data.comment}`});
    } else throw new Error('未解析到成绩');
  } catch(e) {
    document.getElementById('score-content').innerHTML = `<div style="color:#c0392b">打分失败: ${e.message}</div>`;
  }
}

// --- 语音支持 (Web Speech API) ---
let recognition;
function toggleVoice() {
  const btn = document.getElementById('voice-btn');
  const input = document.getElementById('chat-input');
  
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    showToast('当前浏览器不支持语音输入'); return;
  }
  
  if(btn.classList.contains('recording')) {
    recognition.stop();
    btn.classList.remove('recording');
    return;
  }
  
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRec();
  recognition.lang = session.language === '全英文' ? 'en-US' : (session.language === '全日文' ? 'ja-JP' : 'zh-CN');
  recognition.continuous = false;
  recognition.interimResults = true;
  
  recognition.onstart = () => { btn.classList.add('recording'); input.placeholder = '正在聆听...'; };
  recognition.onresult = (e) => {
    let text = '';
    for(let i=0; i<e.results.length; i++) text += e.results[i][0].transcript;
    input.value = text;
  };
  recognition.onerror = () => { showToast('麦克风访问失败'); btn.classList.remove('recording'); };
  recognition.onend = () => { btn.classList.remove('recording'); input.placeholder = '输入回答 (Enter 发送)...'; };
  recognition.start();
}

function speakText(btnEl) {
  if(!synthesis) { showToast('浏览器不支持语音播报'); return; }
  synthesis.cancel(); // 停止当前正在读的
  
  const bubble = btnEl.closest('.msg-bubble');
  const clone = bubble.cloneNode(true);
  const ttsBtn = clone.querySelector('.tts-btn');
  if(ttsBtn) ttsBtn.remove();
  
  const text = clone.textContent.trim();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = session.language === '全英文' ? 'en-US' : (session.language === '全日文' ? 'ja-JP' : 'zh-CN');
  utter.rate = 1.1;
  synthesis.speak(utter);
}

// --- 统一 Fetch API ---
async function callAPI(payload, key, isStream, onChunk) {
  const baseUrl = (document.getElementById('base-url').value.trim() || 'https://api.openai.com/v1').replace(/\/+$/, '');
  const model = document.getElementById('model-select').value;
  abortController = new AbortController();
  
  const messages = Array.isArray(payload) ? payload : [{role:'user', content:payload}];
  
  const resp = await fetch(`${baseUrl}/chat/completions`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
    body: JSON.stringify({ model, messages, stream: isStream, max_tokens: 800, temperature: 0.7 }),
    signal: abortController.signal
  });
  if (!resp.ok) throw new Error(`API ${resp.status}`);
  
  if (!isStream) {
    const json = await resp.json();
    return json.choices[0].message.content;
  }
  
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '', fullText = '';
  
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();
    for (const line of lines) {
      if (!line.trim().startsWith('data: ')) continue;
      const data = line.trim().slice(6);
      if (data === '[DONE]') break;
      try {
        const json = JSON.parse(data);
        fullText += json.choices?.[0]?.delta?.content || '';
        if(onChunk) onChunk(fullText);
      } catch {}
    }
  }
  return fullText;
}

// --- 结束与导出 ---
function endInterview() {
  // 深拷贝保存历史
  const record = {
    id: Date.now(), time: new Date().toLocaleString('zh-CN'),
    mode: session.mode, position: session.position, language: session.language,
    data: JSON.parse(JSON.stringify(session)) // Deep copy
  };
  let hist = JSON.parse(localStorage.getItem('interview_history_v4') || '[]');
  hist.unshift(record);
  localStorage.setItem('interview_history_v4', JSON.stringify(hist.slice(0,20)));
  clearSession();
  switchTab('setup');
  showToast('面试数据已存档至历史记录');
}

function exportMD() {
  let md = `# AI 面试复盘报告\n\n**岗位**：${session.position} | **语言**：${session.language} | **时间**：${new Date().toLocaleString()}\n\n---\n\n`;
  if(session.mode === 'bank') {
    session.questions.forEach((q, i) => {
      const state = session.answersState[i];
      md += `### Q${i+1}: ${q.q}\n\n**我的回答**：\n${state.userAns || '未作答'}\n\n**参考思路**：\n${q.ref}\n\n**AI点评**：\n${state.aiReview || '无'}\n\n---\n`;
    });
  } else {
    session.chatHistory.forEach(msg => {
      if(msg.role==='system') return;
      md += `**${msg.role==='ai'||msg.role==='assistant'?'🤖 面试官':'👤 我'}**：\n${msg.content}\n\n`;
    });
  }
  const blob = new Blob([md], {type: 'text/markdown'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `面试复盘_${session.position}.md`;
  a.click();
}

function renderHistoryList() {
  const el = document.getElementById('history-list');
  const hist = JSON.parse(localStorage.getItem('interview_history_v4') || '[]');
  if (!hist.length) { el.innerHTML = '<div class="history-empty">暂无历史记录</div>'; return; }
  el.innerHTML = hist.map((r,i) => `
    <div class="history-item">
      <div class="history-meta">
        <div class="history-tags">
          <span class="history-tag">${r.position}</span>
          <span class="history-tag">${r.language || '中文'}</span>
          <span class="history-tag">${r.mode==='bank'?'题库':'对话'}</span>
        </div>
        <span class="history-time">${r.time}</span>
      </div>
      <div class="history-actions">
        <button class="history-btn del" onclick="deleteHistory(${i})">删除记录</button>
      </div>
    </div>
  `).join('');
}
function deleteHistory(idx) {
  let hist = JSON.parse(localStorage.getItem('interview_history_v4') || '[]');
  hist.splice(idx, 1);
  localStorage.setItem('interview_history_v4', JSON.stringify(hist));
  renderHistoryList();
}
</script>
